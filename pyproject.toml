[project]
name = "archiagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28",
    "shapely>=2.1",
    "networkx>=3.4",
    "ifcopenshell>=0.8.5",
    "ezdxf>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["anthropic>=1.0", "openai>=1.0"]
vision = ["matplotlib>=3.8", "Pillow>=10"]
cv = ["opencv-python-headless>=4.10,<5"]

[project.scripts]
archiagent = "archiagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["archiagent*"]

[tool.setuptools.package-data]
"archiagent.ingest" = ["*.swift"]

[tool.pytest.ini_options]
testpaths = ["tests", "checks"]
