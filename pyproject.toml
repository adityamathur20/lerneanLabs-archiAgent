[project]
name = "archiagent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.28",
    "shapely>=2.1",
    "networkx>=3.4",
    "ifcopenshell>=0.8.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["archiagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
